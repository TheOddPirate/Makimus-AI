name: Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BRANCH: main
  APP_ID: com.github.Ubaida_M_Yusuf.Makimus_AI
  MANIFEST: com.github.Ubaida_M_Yusuf.Makimus_AI.yaml

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.BRANCH }}

      - name: Read version from version.txt
        id: get_version
        run: |
          VERSION=$(cat version.txt | tr -d '\r\n ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Get latest release version
        id: latest_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release view --json tagName -q .tagName 2>/devnull || echo "")
          latest=${latest#v}
          echo "latest=$latest" >> "$GITHUB_OUTPUT"

      - name: Compare versions
        id: version_check
        run: |
          current="${{ steps.get_version.outputs.version }}"
          latest="${{ steps.latest_release.outputs.latest }}"

          echo "Current version: $current"
          echo "Latest release: $latest"

          if [ -z "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "$(printf '%s\n%s\n' "$latest" "$current" | sort -V | tail -n1)" = "$current" ] && [ "$current" != "$latest" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cancel workflow if version is not updated
        if: steps.version_check.outputs.publish != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            })

      - name: Install Flatpak & Python tooling
        if: steps.version_check.outputs.publish == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-pip python3-setuptools
          sudo pip3 install flatpak-pip-generator --break-system-packages || sudo pip3 install flatpak-pip-generator

      - name: Add Flathub remote & Install SDK
        if: steps.version_check.outputs.publish == 'true'
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub org.freedesktop.Sdk//24.08

      - name: Cache Flatpak runtime and sdk
        if: steps.version_check.outputs.publish == 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.var/app
            ~/.local/share/flatpak
            ~/.cache/flatpak
          key: ${{ runner.os }}-flatpak-${{ hashFiles('com.github.Ubaida_M_Yusuf.Makimus_AI.yaml') }}
          restore-keys: |
            ${{ runner.os }}-flatpak-

      - name: Generate Python Dependencies
        if: steps.version_check.outputs.publish == 'true'
        run: |
          flatpak_pip_generator \
            --requirements-file=requirements-flatpak.txt \
            --output=python-dependencies \
            --runtime=org.freedesktop.Sdk//24.08 \
            --prefer-wheels=torch,torchvision,triton,cuda-bindings,Pillow,pybind11,opencv-python,numpy,rawpy,safetensors,regex,hf-xet,PyYAML,nvidia-cublas,nvidia-cuda-cupti,nvidia-cuda-nvrtc,nvidia-cuda-runtime,nvidia-cudnn-cu13,nvidia-cufft,nvidia-cufile,nvidia-curand,nvidia-cusolver,nvidia-cusparse,nvidia-cusparselt-cu13,nvidia-nccl-cu13,nvidia-nvjitlink,nvidia-nvshmem-cu13,nvidia-nvtx

      - name: Build Flatpak
        if: steps.version_check.outputs.publish == 'true'
        run: |
          flatpak-builder --user --install-deps-from=flathub --force-clean build-dir ${{ env.MANIFEST }}
          rm -rf repo
          flatpak-builder --user --repo=repo --force-clean build-dir ${{ env.MANIFEST }}
          flatpak build-bundle repo Makimus_AI-v${{ steps.get_version.outputs.version }}.flatpak ${{ env.APP_ID }} master

      - name: Create GitHub Release
        if: steps.version_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Makimus-AI v${{ steps.get_version.outputs.version }}
          files: Makimus_AI-v${{ steps.get_version.outputs.version }}.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}